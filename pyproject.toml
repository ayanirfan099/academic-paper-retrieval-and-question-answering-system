[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "paper-retrieval"
version = "0.1.0"
description = "Page-aware evidence retrieval and extractive question answering"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "faiss-cpu>=1.8", "sentence-transformers>=3", "pypdf>=5", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12", "streamlit>=1.40", "httpx>=0.27"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
paper-retrieval = "paper_retrieval.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
